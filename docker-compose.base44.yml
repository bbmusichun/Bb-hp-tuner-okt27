services:
  web:
    image: node:22
    working_dir: /app
    labels:
      base44.project: Resonix Handpan Tuner
      base44.kind: web
      base44.port: "3000"
    restart: on-failure
    ports:
      - "3000:3000"
    environment:
      - BASE44_PREVIEW_MODE
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command:
      - sh
      - -ec
      - |
        npm install --no-audit --no-fund --no-package-lock
        exec npm run dev
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 180s

volumes:
  node_modules:
