<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="metalGrad" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#3b4252" />
      <stop offset="60%" stop-color="#1e2330" />
      <stop offset="100%" stop-color="#0d1117" />
    </radialGradient>
    <radialGradient id="dingGrad" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <!-- Background for maskable icon compliance -->
  <rect width="512" height="512" rx="100" fill="#090d16" />

  <!-- Outer Resonance Waves -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#38bdf8" stroke-opacity="0.15" stroke-width="3" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#ringGrad)" stroke-opacity="0.35" stroke-width="4" />

  <!-- Handpan Shell Body -->
  <circle cx="256" cy="256" r="190" fill="url(#metalGrad)" stroke="#475569" stroke-width="3" />
  
  <!-- Outer rim flange -->
  <circle cx="256" cy="256" r="192" fill="none" stroke="#64748b" stroke-opacity="0.4" stroke-width="2" />

  <!-- 8 Tone Fields on the perimeter -->
  <!-- Top D -->
  <ellipse cx="256" cy="115" rx="34" ry="24" fill="#1e293b" stroke="#38bdf8" stroke-width="2" opacity="0.9" />
  <ellipse cx="256" cy="115" rx="16" ry="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
  
  <!-- Top Right E -->
  <ellipse cx="355" cy="155" rx="30" ry="22" transform="rotate(35 355 155)" fill="#1e293b" stroke="#10b981" stroke-width="2" opacity="0.9" />
  <ellipse cx="355" cy="155" rx="14" ry="9" transform="rotate(35 355 155)" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />

  <!-- Right F -->
  <ellipse cx="395" cy="256" rx="28" ry="20" transform="rotate(85 395 256)" fill="#1e293b" stroke="#10b981" stroke-width="2" opacity="0.9" />
  
  <!-- Bottom Right G -->
  <ellipse cx="355" cy="355" rx="30" ry="22" transform="rotate(135 355 355)" fill="#1e293b" stroke="#a855f7" stroke-width="2" opacity="0.9" />

  <!-- Bottom A -->
  <ellipse cx="256" cy="395" rx="32" ry="22" fill="#1e293b" stroke="#a855f7" stroke-width="2" opacity="0.9" />

  <!-- Bottom Left Bb -->
  <ellipse cx="155" cy="355" rx="30" ry="22" transform="rotate(45 155 355)" fill="#1e293b" stroke="#f59e0b" stroke-width="2" opacity="0.9" />

  <!-- Left C -->
  <ellipse cx="115" cy="256" rx="28" ry="20" transform="rotate(95 115 256)" fill="#1e293b" stroke="#f59e0b" stroke-width="2" opacity="0.9" />

  <!-- Top Left D -->
  <ellipse cx="155" cy="155" rx="30" ry="22" transform="rotate(145 155 155)" fill="#1e293b" stroke="#38bdf8" stroke-width="2" opacity="0.9" />

  <!-- Center Ding Dome -->
  <circle cx="256" cy="256" r="68" fill="#1e293b" stroke="#64748b" stroke-width="2" />
  <circle cx="256" cy="256" r="80" fill="url(#goldGlow)" />
  <circle cx="256" cy="256" r="42" fill="url(#dingGrad)" stroke="#38bdf8" stroke-width="2.5" />
  <circle cx="256" cy="256" r="18" fill="#0c4a6e" stroke="#7dd3fc" stroke-width="1.5" />

  <!-- Acoustic frequency cross lines indicating partials: Fundamental (horizontal), Octave (vertical), Fifth (diagonal) -->
  <line x1="220" y1="256" x2="292" y2="256" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />
  <line x1="256" y1="220" x2="256" y2="292" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" />
  <line x1="230" y1="230" x2="282" y2="282" stroke="#a855f7" stroke-width="2" stroke-linecap="round" />
</svg>
